version: "3.9"

services:
  gform-filler:
    build:
      context: .
    container_name: gform-filler
    working_dir: /app
    environment:
      FORM_FILLER_HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
    volumes:
      - ./responses:/app/responses
      - ./models:/app/models
    command: python app.py
