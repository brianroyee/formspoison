[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gform-filler"
version = "0.1.0"
description = "A Textual interface for authorized Google Forms response entry"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gform-filler = "app:main"

[tool.setuptools]
py-modules = ["app", "csv_data", "parser", "submitter"]